<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CNC Shop Ops{% endblock %}</title>
  <link rel="stylesheet" href="/static/pico.min.css">
  <script src="/static/htmx.min.js"></script>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="container">
    <nav>
      <ul>
        <li><strong><a href="/" class="brand">CNC Shop Ops</a></strong></li>
      </ul>
      <ul>
        <li><a href="/">Dashboard</a></li>
        <li><a href="/customers">Customers</a></li>
        <li><a href="/quotes">Quotes</a></li>
        <li><a href="/jobs">Jobs</a></li>
        <li><a href="/invoices">Invoices</a></li>
        <li><a href="/reports">Reports</a></li>
        <li><a href="/reminders">Reminders</a></li>
        <li><a href="/settings">Settings</a></li>
        <li>
          <form method="post" action="/logout" style="margin:0;display:inline;">
            <button type="submit" class="secondary" style="padding:0.2rem 0.6rem;margin:0;">Logout</button>
          </form>
        </li>
      </ul>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="container">
    <small>Operations only — QuickBooks owns the books.</small>
  </footer>
</body>
</html>
