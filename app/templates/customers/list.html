{% extends "base.html" %}
{% block title %}Customers · CNC Shop Ops{% endblock %}
{% block content %}
<h2>Customers</h2>
<p><a href="/customers/new" role="button">+ New customer</a></p>

<input type="search" name="q" placeholder="Search name, company, email…" value="{{ q }}"
       hx-get="/customers" hx-trigger="input changed delay:300ms, search"
       hx-target="#customer-rows" hx-swap="innerHTML">

<table class="compact">
  <thead><tr><th>Name</th><th>Company</th><th>Email</th><th>Phone</th></tr></thead>
  <tbody id="customer-rows">
    {% include "partials/customer_rows.html" %}
  </tbody>
</table>
{% endblock %}
