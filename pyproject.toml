[project]
name = "cnc-shop-ops"
version = "0.1.0"
description = "Minimal operations tool for a solo CNC machine shop (operations only; QuickBooks owns the money)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.21",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "passlib>=1.7",
    # passlib 1.7.x is incompatible with bcrypt >= 4.1 (backend detection bug),
    # so pin the bcrypt backend below that.
    "bcrypt<4.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
